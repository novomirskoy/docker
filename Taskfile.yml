version: '3'

vars:
  REGISTRY: docker.io/novomirskoy
  PHP_DEPS_IMAGES:
    - composer/composer:2.8-bin
  ARCHS:
    - arm64
    - amd64
  IMAGES:
    - php-cli:8.4
    - postgres:17
    - node:22
  LOG_FILE: build.log

tasks:
  build:
    silent: true
    internal: true
    cmds:
      - "docker build --pull --no-cache --platform=linux/{{.ARCH}} --file=./{{.ENV}}/{{.IMAGE}}/{{.VERSION}}/Dockerfile -t {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}}-{{.ARCH}} ./{{.ENV}}/{{.IMAGE}}"
      - "echo Собран образ: {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}}-{{.ARCH}} | tee -a {{.LOG_FILE}}"
    requires:
      vars:
        - IMAGE
        - VERSION
        - ARCH
        - ENV

  push:
    internal: true
    cmds:
      - "docker push --platform=linux/{{.ARCH}} {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}}-{{.ARCH}}"
    requires:
      vars:
        - IMAGE
        - VERSION
        - ENV
        - ARCH

  build:*:*:*:*:
    cmds:
      - task: build
        vars:
          ENV: "{{index .MATCH 0}}"
          IMAGE: "{{index .MATCH 1}}"
          VERSION: "{{index .MATCH 2}}"
          ARCH: "{{index .MATCH 3}}"

  push:*:*:*:*:
    cmds:
      - task: push
        vars:
          ENV: "{{index .MATCH 0}}"
          IMAGE: "{{index .MATCH 1}}"
          VERSION: "{{index .MATCH 2}}"
          ARCH: "{{index .MATCH 3}}"

  manifest:create:
    internal: true
    cmds:
      - "docker manifest rm {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}} || true"
      - "docker manifest create --amend {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}} {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}}-amd64 {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}}-arm64"
    requires:
      vars:
        - REGISTRY
        - IMAGE
        - ENV
        - VERSION

  manifest:push:
    internal: true
    cmds:
      - "docker manifest push --purge {{.REGISTRY}}/{{.IMAGE}}-{{.ENV}}:{{.VERSION}}"
    requires:
      vars:
        - REGISTRY
        - IMAGE
        - ENV
        - VERSION

  manifest:create:*:*:*:
    cmds:
      - task: manifest:create
        vars:
          ENV: "{{index .MATCH 0}}"
          IMAGE: "{{index .MATCH 1}}"
          VERSION: "{{index .MATCH 2}}"

  manifest:push:*:*:*:
    cmds:
      - task: manifest:push
        vars:
          ENV: "{{index .MATCH 0}}"
          IMAGE: "{{index .MATCH 1}}"
          VERSION: "{{index .MATCH 2}}"

  build:all:
    cmds:
      - for:
          matrix:
            ARCH:
              ref: .ARCHS
            IMAGE:
              ref: .IMAGES
        task: "build:dev:{{.ITEM.IMAGE}}:{{.ITEM.ARCH}}"
      - cat build.log
      - defer: rm build.log


  push:all:
    cmds:
      - for:
          matrix:
            ARCH:
              ref: .ARCHS
            IMAGE:
              ref: .IMAGES
        task: "push:dev:{{.ITEM.IMAGE}}:{{.ITEM.ARCH}}"

  manifest:create:all:
    cmds:
      - for:
          matrix:
            IMAGE:
              ref: .IMAGES
        task: "manifest:create:dev:{{.ITEM.IMAGE}}"

  manifest:push:all:
    cmds:
      - for:
          matrix:
            IMAGE:
              ref: .IMAGES
        task: "manifest:push:dev:{{.ITEM.IMAGE}}"
